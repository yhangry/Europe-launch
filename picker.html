<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>week recap — pick the shots</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900&family=DM+Sans:wght@400;500;700&display=swap">
<style>
  :root{--primary:#F95738;--primary-dark:#ED2E07;--black:#1D1D35;--grey-700:#40495C;
        --grey-500:#828894;--grey-300:#CED3DB;--grey-200:#E6E9F0;--beige:#F8F5F2;
        --green:#04A777;--violet:#7E5FD3}
  *{box-sizing:border-box}
  body{margin:0;background:var(--beige);color:var(--black);font-family:'DM Sans',system-ui,sans-serif}
  header{position:sticky;top:0;z-index:20;background:var(--black);color:#fff;padding:16px 26px;
    display:flex;align-items:center;gap:22px;flex-wrap:wrap;box-shadow:0 2px 18px rgba(29,29,53,.3)}
  header h1{font-family:'Playfair Display',serif;font-weight:900;font-size:22px;margin:0}
  header h1 em{font-style:italic;color:var(--primary)}
  .modes{display:flex;border:1px solid rgba(255,255,255,.28);border-radius:999px;overflow:hidden}
  .modes button{background:none;border:0;color:#fff;font:500 14px 'DM Sans';padding:9px 18px;cursor:pointer}
  .modes button.on{background:var(--primary)}
  .modes button.on[data-m="opener"]{background:var(--violet)}
  .modes button.on[data-m="closer"]{background:var(--green)}
  .tally{margin-left:auto;display:flex;gap:18px;align-items:center;font-size:13px;color:var(--grey-300)}
  .tally b{color:#fff;font-size:17px}
  .act{background:var(--primary);color:#fff;border:0;border-radius:999px;padding:11px 22px;
    font:700 14px 'DM Sans';cursor:pointer}
  .act:hover{background:var(--primary-dark)}
  .act[disabled]{background:var(--grey-500);cursor:not-allowed}
  .hint{padding:16px 26px 0;font-size:14px;color:var(--grey-700);max-width:920px;line-height:1.55}
  main{padding:10px 26px 80px}
  .booking{background:#fff;border:1px solid var(--grey-200);border-radius:14px;padding:18px 20px;margin:16px 0}
  .booking.picked{border-color:var(--primary);box-shadow:0 0 0 2px rgba(249,87,56,.15)}
  .bhead{display:flex;align-items:center;gap:13px;flex-wrap:wrap}
  .avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;background:var(--grey-200);flex:0 0 42px}
  .bname{font-family:'Playfair Display',serif;font-style:italic;font-weight:700;font-size:21px;color:var(--primary)}
  .bmeta{font-size:13px;color:var(--grey-700)}
  .slot{margin-left:auto;font:700 11px 'DM Sans';letter-spacing:.08em;text-transform:uppercase;
    color:#fff;background:var(--black);border-radius:999px;padding:5px 13px}
  .quote{font-family:'Playfair Display',serif;font-style:italic;font-size:16px;color:var(--grey-700);margin:8px 0 14px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(164px,1fr));gap:13px}
  .cell{position:relative;cursor:pointer;border-radius:10px;overflow:hidden;background:var(--grey-200);
    aspect-ratio:4/5;border:3px solid transparent}
  .cell img{width:100%;height:100%;object-fit:cover;display:block}
  .cell.hero{border-color:var(--primary)}
  .cell.opener{border-color:var(--violet)}
  .cell.closer{border-color:var(--green)}
  .cell.dead{opacity:.2;filter:grayscale(1)}
  .badge{position:absolute;top:7px;left:7px;display:flex;gap:4px;flex-wrap:wrap;max-width:78%}
  .chip{font:700 10px 'DM Sans';letter-spacing:.05em;text-transform:uppercase;color:#fff;
    background:rgba(29,29,53,.82);border-radius:999px;padding:3px 8px}
  .chip.hero{background:var(--primary)} .chip.opener{background:var(--violet)} .chip.closer{background:var(--green)}
  .kill{position:absolute;top:7px;right:7px;width:25px;height:25px;border-radius:50%;border:0;
    background:rgba(29,29,53,.72);color:#fff;font-size:14px;cursor:pointer}
  .kill:hover{background:var(--primary-dark)}
  .broke{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:11px;
    color:var(--grey-700);text-align:center;padding:8px;background:var(--grey-200)}
  .cell.err .broke{display:flex} .cell.err img{display:none}
  .out{position:fixed;inset:0;background:rgba(29,29,53,.74);display:none;z-index:40;padding:36px}
  .out.on{display:flex;align-items:center;justify-content:center}
  .panel{background:#fff;border-radius:16px;width:min(960px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden}
  .ptop{padding:16px 22px;border-bottom:1px solid var(--grey-200);display:flex;align-items:center;gap:12px}
  .ptop h2{font-family:'Playfair Display',serif;font-size:19px;margin:0}
  .ptop .act{margin-left:auto}
  .ghost{background:none;border:1px solid var(--grey-300);color:var(--grey-700);border-radius:999px;
    padding:10px 18px;font:500 14px 'DM Sans';cursor:pointer}
  textarea{flex:1;border:0;padding:18px 22px;font:12px/1.5 ui-monospace,Menlo,monospace;resize:none;outline:none;color:var(--grey-700)}
  .warn{background:#FEEEEB;color:var(--primary-dark);padding:10px 22px;font-size:13px}
</style>
</head>
<body>

<header>
  <h1>week recap &mdash; <em>pick the shots</em></h1>
  <div class="modes">
    <button data-m="opener">Opener</button>
    <button data-m="hero" class="on">Heroes</button>
    <button data-m="closer">Closer</button>
  </div>
  <div class="tally">
    <span>Opener <b id="nO">0</b>/1</span>
    <span>Heroes <b id="nH">0</b>/5</span>
    <span>Closer <b id="nC">0</b>/1</span>
    <button class="act" id="build">Build the deck</button>
  </div>
</header>

<p class="hint" id="hint"></p>
<main id="sheet"></main>

<div class="out" id="out">
  <div class="panel">
    <div class="ptop">
      <div class="modes" style="border-color:var(--grey-300)">
        <button data-v="deck" class="on" style="color:var(--grey-700)">Deck</button>
        <button data-v="caption" style="color:var(--grey-700)">Caption pack</button>
      </div>
      <button class="ghost" id="close">Close</button>
      <button class="ghost" id="dl">Download</button>
      <button class="act" id="copy">Copy</button>
    </div>
    <div class="warn" id="warn" style="display:none"></div>
    <textarea id="code" spellcheck="false" readonly></textarea>
  </div>
</div>

<script>
const CDN='https://cdn.yhangry.com/media/production/', CHEFCDN='https://cdn.yhangry.com/';
const DS='_ds/yhangry-design-system-f04f0bd4-7a59-43b5-a4c2-b8016a42b1d9/';

const HOOK_OPEN_A='where', HOOK_OPEN_B='yhangry', HOOK_OPEN_LOOP='cooked', HOOK_OPEN_D='this week';
const HOOK_CLOSE_A='the chefs', HOOK_CLOSE_LOOP='ate', HOOK_CLOSE_C='this', HOOK_CLOSE_D='week';

const BOOKINGS=[
 {order:181314,customer:'Pete',chef:'Scott M',city:'South Gloucestershire',guests:20,date:'2026-09-05',

 {order:175264,customer:'Charlotte',chef:'James C',city:'Flintshire',guests:18,date:'2026-09-04',
  avatar:'chefs/profile-images/Z1X3IBk8gsrXXU2duyurbsrjwer37DEJRh4Xxnrh.jpg',

  full:"Chef James was so professional and added an air of calm to the night which is exactly what was needed. The food was delicious and everyone loved it. Our kitchen was left immaculate.",
  media:[[289073,'customer','IMG_0708.jpeg'],[289074,'customer','IMG_0701.jpeg'],[287803,'chef','6650b4df-75b9-46d6-81b4-2c33a9a788c8.jpeg']]},
 {order:184785,customer:'Diane',chef:'David E',city:'South Derbyshire',guests:8,date:'2026-09-08',
  avatar:'chefs/profile-images/pQQi4MdBTq8FoNvNv9tLDFNuulZWVEAPui9jepFA.jpg',
  frag:"Stunning, and up to high end restaurant quality.",
  full:"The whole experience was excellent. The food and its presentation was stunning, and definitely up to high end restaurant quality. David was great to deal with and made adjustments to the dishes. We would use David again.",

  avatar:'chefs/profile-images/Zlglgssk4qGvLdA5fHbfFTOpsXxyFrDsCoXXU5Gg.jpg',

 {order:121372,customer:'Tom',chef:'Fouad M',city:'Merton',guests:20,date:'2026-09-05',

 {order:180158,customer:'Simon',chef:'Giulio C',city:'Denbighshire',guests:2,date:'2026-09-04',

];

let mode='hero';
const heroes=new Map(); let opener=null, closer=null; const dead=new Set();
const url=(id,fn)=>CDN+id+'/'+fn;
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

document.getElementById('hint').textContent =
 'Opener and Closer are one frame each, full-bleed behind big type, so they need your brightest cleanest shots. '+
 'Heroes is one frame per booking, five bookings. Every frame is cropped to 4:5 here, exactly what Instagram shows. '+
 'The x hides anything tilted, dark, flash-blown or cluttered, and a hidden frame cannot be picked.';

function render(){
  document.getElementById('sheet').innerHTML = BOOKINGS.map(b=>{
    const hero=heroes.get(b.order);
    const cells=b.media.map(([id,src,fn])=>{
      const isH=hero&&hero[0]===id, isO=opener&&opener[0]===id, isC=closer&&closer[0]===id;
      const cls=['cell',isH?'hero':'',isO?'opener':'',isC?'closer':'',dead.has(id)?'dead':''].join(' ');
      const chips=(isO?'<span class="chip opener">Opener</span>':'')+(isC?'<span class="chip closer">Closer</span>':'')+
                  (isH?'<span class="chip hero">Hero</span>':'')+'<span class="chip">'+src+'</span>';
      return '<div class="'+cls+'" data-id="'+id+'" data-order="'+b.order+'" data-fn="'+esc(fn)+'">'+
        '<img src="'+url(id,fn)+'" loading="lazy" alt="" onerror="this.closest(\'.cell\').classList.add(\'err\')">'+
        '<div class="broke">'+id+' did not load</div><div class="badge">'+chips+'</div>'+
        '<button class="kill" data-kill="'+id+'">&times;</button></div>';
    }).join('');
    const n=[...heroes.keys()].indexOf(b.order);
    return '<section class="booking'+(hero?' picked':'')+'"><div class="bhead">'+
      '<img class="avatar" src="'+CHEFCDN+b.avatar+'" alt="" onerror="this.style.visibility=\'hidden\'">'+
      '<span class="bname">'+esc(b.chef)+'</span><span class="bmeta">'+esc(b.city)+' &middot; '+b.guests+
      ' guests &middot; '+b.date+' &middot; order '+b.order+'</span>'+
      (hero?'<span class="slot">Slide '+(n+2)+'</span>':'')+'</div>'+
      '<div class="quote">&ldquo;'+esc(b.frag)+'&rdquo;</div><div class="grid">'+cells+'</div></section>';
  }).join('');
  document.getElementById('nO').textContent=opener?1:0;
  document.getElementById('nH').textContent=heroes.size;
  document.getElementById('nC').textContent=closer?1:0;
  document.getElementById('build').disabled=!(opener&&closer&&heroes.size===5);
}

document.getElementById('sheet').addEventListener('click',e=>{
  const k=e.target.closest('[data-kill]');
  if(k){const id=+k.dataset.kill; dead.has(id)?dead.delete(id):dead.add(id);
    for(const [o,h] of heroes) if(h[0]===id) heroes.delete(o);
    if(opener&&opener[0]===id) opener=null; if(closer&&closer[0]===id) closer=null; return render();}
  const c=e.target.closest('.cell'); if(!c) return;
  const id=+c.dataset.id, order=+c.dataset.order, fn=c.dataset.fn; if(dead.has(id)) return;
  if(mode==='opener') opener=(opener&&opener[0]===id)?null:[id,fn];
  else if(mode==='closer') closer=(closer&&closer[0]===id)?null:[id,fn];
  else{const cur=heroes.get(order);
    if(cur&&cur[0]===id) heroes.delete(order);
    else{if(!cur&&heroes.size>=5) return alert('Five bookings already. Unpick one first.'); heroes.set(order,[id,fn]);}}
  render();
});
document.querySelectorAll('.modes button').forEach(btn=>btn.onclick=()=>{
  mode=btn.dataset.m; document.querySelectorAll('.modes button').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');});

const GRAD='linear-gradient(to top, rgba(16,24,40,0.78) 0%, rgba(16,24,40,0.66) 30%, rgba(16,24,40,0.34) 62%, rgba(16,24,40,0) 100%)';
const WM='    <sc-if value="{{ showWordmark }}" hint-placeholder-val="{{ true }}">\n      <img src="assets/yhangry-logo-white.svg" alt="yhangry" style="position:absolute;top:56px;right:56px;width:196px;height:auto;display:block;z-index:4" />\n    </sc-if>';
const PILL="background:#F8F5F2;color:#1D1D35;font-family:'DM Sans',system-ui,sans-serif;font-weight:500;letter-spacing:0.01em;border-radius:999px;box-shadow:0 2px 16px rgba(16,24,40,0.3)";
const LOOP='<svg viewBox="0 0 400 150" preserveAspectRatio="none" style="position:absolute;left:-9%;top:-20%;width:118%;height:140%;overflow:visible;pointer-events:none" aria-hidden="true"><path d="M44,44 C118,10 302,6 368,44 C402,64 384,116 302,132 C214,150 66,144 26,112 C2,92 12,56 58,36" fill="none" stroke="#F95738" stroke-width="9" stroke-linecap="round" opacity="0.92"/></svg>';

${WM}

  </section>`;
}

function chefSlide(b,m,n){
  return `
  <section data-label="0${n} ${esc(b.chef)}" data-screen-label="0${n}" data-speaker-notes="${esc(b.chef)}, ${esc(b.city)}, ${b.guests} guests. Full review: ${esc(b.full)}" style="position:relative;width:100%;height:100%;overflow:hidden;background:#1D1D35">
    <img src="${url(m[0],m[1])}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block" />
    <div style="position:absolute;left:0;right:0;bottom:0;height:58%;background:${GRAD};opacity:{{ gradientOpacity }}"></div>
${WM}
    <div style="position:absolute;left:72px;right:100px;bottom:84px;display:flex;flex-direction:column;gap:30px">
      <div style="display:flex;flex-direction:column;gap:16px">
        <div style="font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:400;font-size:50px;line-height:1.26;letter-spacing:-0.01em;color:#FFFFFF;text-shadow:0 1px 18px rgba(16,24,40,0.6);text-wrap:balance">&ldquo;${esc(b.frag)}&rdquo;</div>
        <div style="font-family:'DM Sans',system-ui,sans-serif;font-weight:400;font-size:29px;letter-spacing:0.02em;color:#CED3DB;text-shadow:0 1px 14px rgba(16,24,40,0.6)">&mdash; ${esc(b.customer)}</div>
      </div>
      <div style="display:flex;align-items:center;gap:26px">
        <img src="${CHEFCDN}${b.avatar}" alt="" style="width:112px;height:112px;flex:0 0 112px;border-radius:50%;object-fit:cover;display:block;border:3px solid rgba(255,255,255,0.92);box-shadow:0 2px 18px rgba(16,24,40,0.5)" />
        <div style="display:flex;flex-direction:column;gap:8px">

const KEYWORDS=['private chef near me','hire a private chef','private chef UK','at home dining',
  'dinner party catering','private chef hire','in-home chef','chef for hire'];

function buildCaptionPack(){
  const p=BOOKINGS.filter(b=>heroes.has(b.order));
  const counties=p.map(b=>b.city);
  const total=p.reduce((s,b)=>s+b.guests,0);
  const uniq=[...new Set(counties)];
  const lead=p.map(b=>`${b.guests} in ${b.city}`).slice(0,3).join('. ');

  const alts=['Private chef table setting at a UK home dinner party']
    .concat(p.map(b=>`Private chef dinner for ${b.guests} guests in ${b.city}`))
    .concat(['Hire a private chef in the UK — yhangry']);

  return `CAPTION PACK — week recap, ${p[0].date} week
=================================================

INSTAGRAM CAPTION
-----------------
Private chef dinners across the UK this week — ${p.length} kitchens, ${uniq.length} counties. ${lead}. Every one cooked in someone's own kitchen, cleared up, and gone by midnight.

Book a private chef near you — link in bio.

#privatechef #privatechefuk #dinnerparty #athomedining #yhangry


FACEBOOK CAPTION
----------------
Private chef dinners across the UK this week. ${p.length} kitchens, ${uniq.length} counties, ${total} people fed — and nobody cooked or washed up. ${lead}.

Book a private chef near you: https://yhangry.com

#privatechef #dinnerparty #yhangry


ALT TEXT — one per slide, fill these in when scheduling
------------------------------------------------------
${alts.map((a,i)=>`Slide ${i+1}  ${a}`).join('\n')}


KEYWORDS — rotate through captions week to week
-----------------------------------------------
${KEYWORDS.join(' · ')}
Plus this week's locations: ${uniq.join(' · ')}


NOTES
-----
Instagram is not indexed by Google — first caption line, alt text and hashtags
are what IG itself indexes. Alt text is the highest-value field because almost
nobody fills it in.
Facebook IS indexed by Google, so the FB caption carries the real URL, never
"link in bio".
Five hashtags on IG, three on FB. More reads as spam and does not add reach.`;
}

let VIEW={deck:'',caption:''};
document.querySelectorAll('.ptop .modes button').forEach(btn=>btn.onclick=()=>{
  document.querySelectorAll('.ptop .modes button').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  document.getElementById('code').value=VIEW[btn.dataset.v];
});

document.getElementById('build').onclick=()=>{
  const picked=BOOKINGS.filter(b=>heroes.has(b.order));
  const cities=picked.map(b=>b.city); const w=document.getElementById('warn');
  const dupe=cities.some((c,i)=>cities.some((d,j)=>i!==j&&(c.includes(d)||d.includes(c))));
  if(dupe){w.style.display='block';w.textContent='Two of your five are in the same place. The spread of locations is the whole point of this format.';}
  else w.style.display='none';
  VIEW.deck=buildDeck(); VIEW.caption=buildCaptionPack();
  document.querySelectorAll('.ptop .modes button').forEach(b=>b.classList.remove('on'));
  document.querySelector('.ptop .modes button[data-v="deck"]').classList.add('on');
  document.getElementById('code').value=VIEW.deck;
  document.getElementById('out').classList.add('on');
};
document.getElementById('close').onclick=()=>document.getElementById('out').classList.remove('on');
document.getElementById('copy').onclick=()=>{const t=document.getElementById('code');t.select();
  document.execCommand('copy');const b=document.getElementById('copy');b.textContent='Copied';setTimeout(()=>b.textContent='Copy',1400);};
document.getElementById('dl').onclick=()=>{
  const isDeck=document.querySelector('.ptop .modes button.on').dataset.v==='deck';
  const blob=new Blob([document.getElementById('code').value],{type:isDeck?'text/html':'text/plain'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=isDeck?'Chefs This Week Carousel.dc.html':'caption-pack.txt';
  a.click();URL.revokeObjectURL(a.href);};

render();
</script>
